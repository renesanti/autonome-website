name: AI Autonomous Update

on:
  schedule:
    # Draait automatisch elke dag om 00:00 UTC (aanpasbaar)
    - cron: '0 0 * * *'
  workflow_dispatch: # Hiermee kun je het ook handmatig starten via GitHub

jobs:
  update-website:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Belangrijk: geeft de Action toestemming om code terug te pushen

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Run AI Generator Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # Pakt je opgeslagen sleutel
        run: |
          python generate_content.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action AI Agent"
          git add index.html
          # Alleen committen als er echt iets veranderd is
          git diff-index --quiet HEAD || git commit -m "AI: Automatische update van content en design"
          git push

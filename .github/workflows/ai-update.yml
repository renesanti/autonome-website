name: Autonomous UX & Content Update

on:
  schedule:
    - cron: '0 0 * * *' # Elke nacht om 00:00 UTC
  workflow_dispatch: # Handmatig te starten via het Actions tabblad

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai pillow playwright requests feedparser
          playwright install chromium --with-deps

      - name: Fetch Reddit Trending Topics
        run: python scripts/fetch_reddit.py

      - name: Fetch RSS Trending Topics
        run: python scripts/fetch_rss_trending.py

      - name: Run Visual UX Optimizer (Content & HTML update)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python visual_ux_improver.py

      - name: Capture Screenshots (Crawler)
        run: python ux_screenshot_crawler.py

      - name: Run Visual UX Audit & Developer Fixes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python visual_ux_auditor.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.io"
          git add *.html trending.db screenshots/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Nieuw artikel, visuele audit & homepage bijgewerkt" && git push)
